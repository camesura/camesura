name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install project toolchain
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.9
          cache: true

      - name: Restore Dart packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build APK
        run: mise run android-apk

      - name: Prepare release files
        run: |
          apk="camesura-${GITHUB_REF_NAME}-android.apk"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="camesura-${GITHUB_REF_NAME}-android.apk"
          gh release create "$GITHUB_REF_NAME" \
            "$apk" \
            "$apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "かめすら ${GITHUB_REF_NAME}"
