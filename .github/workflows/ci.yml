name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install project toolchain
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.9
          cache: true
          cache_key_files: 'mise.toml'

      - name: Restore Dart packages
        uses: actions/cache@v6.1.0
        with:
          path: |
                ~/.pub-cache
                ${{ runner.tool_cache }}/flutter
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub

      - name: Run checks
        run: mise run ci
